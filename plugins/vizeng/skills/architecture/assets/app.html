<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vizeng</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e2e0db;
  --accent: #2563eb; --accent-ink: #ffffff; --warn-bg: #fff4d6; --warn-ink: #6a4a00;
  --err-bg: #fde8e8; --err-ink: #8a1c1c; --ok-ink: #1f7a3d; --chip: #efeee9;
  --paper: #fbfaf7; --dot: #d9d6cf;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #18181b; --panel: #202024; --ink: #ececef; --muted: #9a9aa2; --line: #34343a;
    --accent: #5b8cff; --accent-ink: #0b0b0d; --warn-bg: #3a3014; --warn-ink: #f3d68a;
    --err-bg: #3b1d1d; --err-ink: #ffb4b4; --ok-ink: #7bd99b; --chip: #2a2a2f;
    --paper: #f4f2ee; --dot: #d4d1ca;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 13px/1.4 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif; display: grid; grid-template-rows: 44px 1fr; overflow: hidden; }
button, select, input, textarea { font: inherit; color: inherit; }
header { display: flex; align-items: center; gap: 6px; padding: 0 10px; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
.brand { font-weight: 700; letter-spacing: .02em; margin-right: 6px; }
.brand span { color: var(--accent); }
.sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; flex: none; }
.tb { height: 30px; min-width: 30px; padding: 0 8px; border: 1px solid transparent; border-radius: 7px; background: transparent; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 5px; white-space: nowrap; }
.tb:hover { background: var(--chip); }
.tb[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.tb svg { width: 16px; height: 16px; flex: none; }
.tb kbd { font: 10px ui-monospace, monospace; opacity: .6; }
select.tb { border-color: var(--line); padding-right: 4px; }
.grow { flex: 1; min-width: 8px; }
#status { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
#status.ok { color: var(--ok-ink); }
#status.err { color: var(--err-ink); }
main { display: grid; grid-template-columns: 1fr 300px; min-height: 0; }
#stage { position: relative; overflow: hidden; background-color: var(--paper); cursor: default; touch-action: none; }
#stage.panning { cursor: grabbing; }
#stage.tool-create { cursor: crosshair; }
#svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; user-select: none; -webkit-user-select: none; }
#banner { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); display: none; gap: 8px; align-items: center; padding: 8px 10px 8px 14px; border-radius: 10px; background: var(--warn-bg); color: var(--warn-ink); box-shadow: 0 4px 18px rgba(0,0,0,.12); z-index: 5; max-width: calc(100% - 32px); }
#banner.err { background: var(--err-bg); color: var(--err-ink); }
#banner.show { display: flex; }
#banner button { border: 1px solid currentColor; background: transparent; border-radius: 6px; padding: 3px 9px; cursor: pointer; }
#zoom { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 3px; z-index: 4; }
#zoom .tb { height: 26px; min-width: 26px; }
#zoomPct { min-width: 46px; font-variant-numeric: tabular-nums; }
#empty { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; color: #8a877f; pointer-events: none; text-align: center; }
#empty.show { display: flex; }
aside { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 14px 14px 40px; }
aside h3 { margin: 0 0 10px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
aside h3.sub { margin-top: 18px; }
.f { display: grid; gap: 4px; margin-bottom: 10px; }
.f > span { font-size: 11.5px; color: var(--muted); }
.f > span em { font-style: normal; opacity: .7; }
.f input, .f textarea, .f select { width: 100%; border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; background: var(--bg); outline: none; }
.f textarea { resize: vertical; min-height: 34px; }
.f input:focus, .f textarea:focus, .f select:focus { border-color: var(--accent); }
aside .row select { border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; background: var(--bg); outline: none; }
header select.tb { background: var(--panel); }
.row { display: flex; gap: 6px; }
.row > * { flex: 1; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { flex: 1; border: 0; background: transparent; padding: 5px 4px; cursor: pointer; font-size: 12px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.swatches button { width: 24px; height: 24px; border-radius: 6px; cursor: pointer; border: 2px solid transparent; }
.swatches button[aria-pressed="true"] { border-color: var(--accent); }
.btn { border: 1px solid var(--line); background: var(--bg); border-radius: 7px; padding: 6px 10px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.danger:hover { border-color: #d33; color: #d33; }
.problems { margin: 0; padding-left: 16px; color: var(--err-ink); font-size: 12px; }
.help { color: var(--muted); font-size: 12px; line-height: 1.7; }
.help kbd { font: 11px ui-monospace, monospace; background: var(--chip); border-radius: 4px; padding: 0 4px; }
.muted { color: var(--muted); font-size: 12px; }
@media (max-width: 860px) {
  main { grid-template-columns: 1fr; grid-template-rows: 1fr 40%; }
  aside { border-left: 0; border-top: 1px solid var(--line); }
  .tb kbd, .wide { display: none; }
}
</style>
</head>
<body>
<header>
  <div class="brand">viz<span>eng</span></div>
  <select id="docSel" class="tb" title="Diagram in .vizeng/"></select>
  <div class="sep"></div>
  <button class="tb" data-tool="select" title="Select / move (V)"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M3 1.5l9.5 6-4.2.9 2.4 4.6-1.6.8-2.4-4.6L3.6 12z"/></svg><kbd>V</kbd></button>
  <button class="tb" data-tool="box" title="Box (B)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3.5" width="12" height="9" rx="1.5"/></svg><kbd>B</kbd></button>
  <button class="tb" data-tool="circle" title="Circle (C)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="5.5"/></svg><kbd>C</kbd></button>
  <button class="tb" data-tool="text" title="Text (T)"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M3 3h10v2.2h-1.4V4.4H8.7V12h1.5v1.3H5.8V12h1.5V4.4H4.4v.8H3z"/></svg><kbd>T</kbd></button>
  <button class="tb" data-tool="note" title="Note for the agent (N)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 2.5h11v7l-4 4h-7z"/><path d="M9.5 13.5v-4h4"/></svg><kbd>N</kbd></button>
  <button class="tb" data-tool="arrow" title="Connect: drag from one shape to another (A)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 13.5L13 3"/><path d="M7.5 3H13v5.5"/></svg><kbd>A</kbd></button>
  <div class="sep"></div>
  <button class="tb wide" id="bLayout" title="Auto-layout all shapes (L)">Layout</button>
  <button class="tb" id="bUndo" title="Undo (⌘Z)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 3L2 6l3 3"/><path d="M2 6h7a4 4 0 010 8H6"/></svg></button>
  <button class="tb" id="bRedo" title="Redo (⇧⌘Z)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11 3l3 3-3 3"/><path d="M14 6H7a4 4 0 000 8h3"/></svg></button>
  <div class="grow"></div>
  <span id="status"></span>
  <div class="sep"></div>
  <button class="tb" id="bImport" title="Import JSON">Import</button>
  <button class="tb" id="bJson" title="Download JSON">JSON</button>
  <button class="tb" id="bPng" title="Download PNG">PNG</button>
  <input type="file" id="fileIn" accept="application/json,.json" hidden>
</header>
<main>
  <div id="stage">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="empty"><div>Empty diagram<br><span style="font-size:12px">Pick a shape tool and click, or double-click the canvas</span></div></div>
    <div id="banner"><span id="bannerMsg"></span><span id="bannerBtns"></span></div>
    <div id="zoom">
      <button class="tb" id="zOut" title="Zoom out (-)">−</button>
      <button class="tb" id="zoomPct" title="Reset to 100% (0)">100%</button>
      <button class="tb" id="zIn" title="Zoom in (+)">+</button>
      <button class="tb" id="zFit" title="Fit and re-center (F)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 5.5V2h3.5M10.5 2H14v3.5M14 10.5V14h-3.5M5.5 14H2v-3.5"/></svg></button>
    </div>
  </div>
  <aside id="panel"></aside>
</main>
<script>
"use strict";
/* ------------------------------------------------------------------ model */
const Q = new URLSearchParams(location.search);
const TOKEN = Q.get("token") || "";
const ROLES = ["Entry","Source","Gate","Transform","Router","Orchestrator","Store","Adapter","Policy","Sink","Contract"];
const RELS = ["calls","emits","reads","writes","owns","implements","guards","configures"];
const LIST_FIELDS = ["owns","does","never","effects","fails","invariants","paths","tests"];
const CARD_FIELDS = {
  "model-native": [
    ["purpose","one sentence: why this exists",false],
    ["owns","state / data only this touches",true],
    ["does","verbs it performs",true],
    ["never","what it must not do",true],
    ["in","inputs (typed)",false], ["out","outputs (typed)",false],
    ["effects","side effects: IO, network, writes",true],
    ["fails","failure modes and how they surface",true],
    ["invariants","rules that must hold",true],
    ["paths","source files",true], ["tests","guard tests",true], ["notes","",false]],
  "system": [
    ["purpose","responsibility",false], ["tech","runtime / technology",false],
    ["paths","source files",true], ["notes","",false]],
};
// Explicit colors (not CSS vars) so PNG export renders identically.
const COLORS = {
  default: ["#ffffff","#3f3f46"], blue: ["#e8f0ff","#2f5fd0"], green: ["#e6f6ec","#2b8a4b"],
  amber: ["#fff3db","#b7791f"], red: ["#fde9e9","#c53030"], purple: ["#f1ebff","#6b46c1"], gray: ["#eeeeee","#71717a"],
};
const NOTE = ["#fff7b8","#c9a800"];
const FONT = 'ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif';

let S = {
  name: Q.get("name") || "", doc: null, rev: "", dirty: false, saving: false, conflict: false,
  view: {x: 0, y: 0, k: 1}, sel: null, tool: "select", undo: [], redo: [],
  edgeStyle: {style: "solid", weight: "normal", arrow: "end"}, showDetails: true, list: [],
};
const $ = (id) => document.getElementById(id);
const svg = $("svg"), stage = $("stage");
const measureCtx = document.createElement("canvas").getContext("2d");

function api(path, params = {}, opts = {}) {
  const u = new URLSearchParams({token: TOKEN, ...params});
  return fetch(`/api/${path}?${u}`, opts).then(async (r) => ({status: r.status, body: await r.json().catch(() => ({}))}));
}
const node = (id) => S.doc.nodes.find((n) => n.id === id);
const isMN = () => S.doc && S.doc.kind === "model-native";
function uid(prefix) {
  const used = new Set([...S.doc.nodes, ...S.doc.edges].map((o) => o.id));
  let i = 1; while (used.has(prefix + i)) i++; return prefix + i;
}
function defaults(shape) {
  if (shape === "circle") return {w: 96, h: 96};
  if (shape === "text") return {w: 160, h: 40};
  if (shape === "note") return {w: 190, h: 96};
  return isMN() ? {w: 210, h: 100} : {w: 170, h: 70};
}

/* ------------------------------------------------------------------ history */
function snapshot() { return JSON.stringify(S.doc); }
function pushUndo() { S.undo.push(snapshot()); if (S.undo.length > 200) S.undo.shift(); S.redo = []; }
function changed() { S.dirty = true; render(); scheduleSave(); }
function undo() { if (!S.undo.length) return; S.redo.push(snapshot()); S.doc = JSON.parse(S.undo.pop()); keepSel(); changed(); renderPanel(); }
function redo() { if (!S.redo.length) return; S.undo.push(snapshot()); S.doc = JSON.parse(S.redo.pop()); keepSel(); changed(); renderPanel(); }
function keepSel() {
  if (!S.sel) return;
  const pool = S.sel.type === "node" ? S.doc.nodes : S.doc.edges;
  if (!pool.some((o) => o.id === S.sel.id)) S.sel = null;
}

/* ------------------------------------------------------------------ text */
function wrap(text, maxW, font, maxLines) {
  measureCtx.font = font;
  const out = [];
  for (const para of String(text || "").split("\n")) {
    let line = "";
    for (const word of para.split(/\s+/).filter(Boolean)) {
      const t = line ? line + " " + word : word;
      if (measureCtx.measureText(t).width <= maxW || !line) line = t;
      else { out.push(line); line = word; }
    }
    out.push(line);
  }
  if (maxLines && out.length > maxLines) {
    const cut = out.slice(0, maxLines);
    let last = cut[maxLines - 1];
    while (last && measureCtx.measureText(last + "…").width > maxW) last = last.slice(0, -1);
    cut[maxLines - 1] = last + "…";
    return cut;
  }
  return out;
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

/* ------------------------------------------------------------------ geometry */
function center(n) { return {x: n.x + n.w / 2, y: n.y + n.h / 2}; }
function clip(n, toward) {
  const c = center(n), dx = toward.x - c.x, dy = toward.y - c.y;
  if (!dx && !dy) return c;
  let t;
  if (n.shape === "circle") t = 1 / Math.sqrt((dx / (n.w / 2)) ** 2 + (dy / (n.h / 2)) ** 2);
  else t = Math.min(dx ? (n.w / 2) / Math.abs(dx) : Infinity, dy ? (n.h / 2) / Math.abs(dy) : Infinity);
  const len = Math.hypot(dx, dy), gap = 3 / len;
  return {x: c.x + dx * (t + gap), y: c.y + dy * (t + gap)};
}
const rectOf = (n, m = 0) => ({x0: n.x - m, y0: n.y - m, x1: n.x + n.w + m, y1: n.y + n.h + m});
const area = (a, b) => Math.max(0, Math.min(a.x1, b.x1) - Math.max(a.x0, b.x0)) * Math.max(0, Math.min(a.y1, b.y1) - Math.max(a.y0, b.y0));
const inRect = (p, r) => p.x > r.x0 && p.x < r.x1 && p.y > r.y0 && p.y < r.y1;
const mean = (a) => a.reduce((s, v) => s + v, 0) / a.length;
const median = (a) => { const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const r1 = (v) => Math.round(v * 10) / 10;
function segX(p, q, r, s) {
  const d = (q.x - p.x) * (s.y - r.y) - (q.y - p.y) * (s.x - r.x);
  if (!d) return false;
  const t = ((r.x - p.x) * (s.y - r.y) - (r.y - p.y) * (s.x - r.x)) / d, u = ((r.x - p.x) * (q.y - p.y) - (r.y - p.y) * (q.x - p.x)) / d;
  return t > 0 && t < 1 && u > 0 && u < 1;
}
function segHitsRect(p, q, r) {
  if (Math.max(p.x, q.x) <= r.x0 || Math.min(p.x, q.x) >= r.x1 || Math.max(p.y, q.y) <= r.y0 || Math.min(p.y, q.y) >= r.y1) return false;
  if (inRect(p, r) || inRect(q, r)) return true;
  const a = {x: r.x0, y: r.y0}, b = {x: r.x1, y: r.y0}, c = {x: r.x1, y: r.y1}, d = {x: r.x0, y: r.y1};
  return segX(p, q, a, b) || segX(p, q, b, c) || segX(p, q, c, d) || segX(p, q, d, a);
}
function lineHitsRect(pts, r) {
  for (let i = 0; i + 1 < pts.length; i++) if (segHitsRect(pts[i], pts[i + 1], r)) return true;
  return false;
}
const boxOf = (pts) => ({x0: Math.min(...pts.map((p) => p.x)), y0: Math.min(...pts.map((p) => p.y)), x1: Math.max(...pts.map((p) => p.x)), y1: Math.max(...pts.map((p) => p.y))});
function crossings(A, B) {
  const a = A.box, b = B.box;
  if (a.x1 < b.x0 || b.x1 < a.x0 || a.y1 < b.y0 || b.y1 < a.y0) return 0;
  let n = 0;
  for (let i = 0; i + 1 < A.pts.length; i++) for (let j = 0; j + 1 < B.pts.length; j++) if (segX(A.pts[i], A.pts[i + 1], B.pts[j], B.pts[j + 1])) n++;
  return n;
}
const sharesEnd = (e, f) => e.from === f.from || e.from === f.to || e.to === f.from || e.to === f.to;

// Paths are straight lines or one quadratic bend; sampled so routing and label placement can
// test them against shapes, labels and each other.
const SAMPLES = 24;
// Bezier through control points (none = straight, one = single bend, two = S-curve).
function pathOf(p, cs, q) {
  const P = [p, ...cs, q], n = P.length - 1;
  const bern = (t, k, m) => { let c = 1; for (let i = 0; i < k; i++) c = (c * (m - i)) / (i + 1); return c * (1 - t) ** (m - k) * t ** k; };
  const at = (t) => ({x: P.reduce((s, pt, k) => s + bern(t, k, n) * pt.x, 0), y: P.reduce((s, pt, k) => s + bern(t, k, n) * pt.y, 0)});
  const tan = (t) => {
    let x = 0, y = 0;
    for (let k = 0; k < n; k++) { const b = bern(t, k, n - 1); x += b * (P[k + 1].x - P[k].x); y += b * (P[k + 1].y - P[k].y); }
    return {x, y};
  };
  const pts = [];
  for (let i = 0; i <= SAMPLES; i++) pts.push(at(i / SAMPLES));
  const nrm = (t) => { const v = tan(t), l = Math.hypot(v.x, v.y) || 1; return {x: -v.y / l, y: v.x / l}; };
  const f = (pt) => `${r1(pt.x)},${r1(pt.y)}`;
  return {d: `M${f(p)} ${["L", "Q", "C"][cs.length]}${[...cs, q].map(f).join(" ")}`, pts, box: boxOf(pts), at, nrm};
}
function curve(e, a, b, bend) {
  const ca = center(a), cb = center(b);
  if (!bend) return pathOf(clip(a, cb), [], clip(b, ca));
  // canonical normal so A->B and B->A bow to opposite sides consistently
  const [lo, hi] = e.from < e.to ? [ca, cb] : [cb, ca];
  const dx = hi.x - lo.x, dy = hi.y - lo.y, len = Math.hypot(dx, dy) || 1;
  const ctrl = {x: (ca.x + cb.x) / 2 - (dy / len) * bend * 2, y: (ca.y + cb.y) / 2 + (dx / len) * bend * 2};
  return pathOf(clip(a, ctrl), [ctrl], clip(b, ctrl));
}
// Orthogonal polyline with rounded corners, for edges routed around shapes on the grid.
function polyPath(P) {
  const f = (pt) => `${r1(pt.x)},${r1(pt.y)}`, dist = (p, q) => Math.hypot(q.x - p.x, q.y - p.y);
  const toward = (c, p, r) => { const l = dist(c, p) || 1; return {x: c.x + ((p.x - c.x) * r) / l, y: c.y + ((p.y - c.y) * r) / l}; };
  let d = `M${f(P[0])}`;
  for (let i = 1; i < P.length - 1; i++) {
    const r = Math.min(14, dist(P[i - 1], P[i]) / 2, dist(P[i], P[i + 1]) / 2);
    d += ` L${f(toward(P[i], P[i - 1], r))} Q${f(P[i])} ${f(toward(P[i], P[i + 1], r))}`;
  }
  d += ` L${f(P[P.length - 1])}`;
  const cum = [0];
  for (let i = 1; i < P.length; i++) cum.push(cum[i - 1] + dist(P[i - 1], P[i]));
  const total = cum[cum.length - 1] || 1;
  const segAt = (t) => { const s = t * total; let i = 1; while (i < P.length - 1 && cum[i] < s) i++; return [i, (s - cum[i - 1]) / ((cum[i] - cum[i - 1]) || 1)]; };
  const at = (t) => { const [i, u] = segAt(t); return {x: P[i - 1].x + (P[i].x - P[i - 1].x) * u, y: P[i - 1].y + (P[i].y - P[i - 1].y) * u}; };
  const nrm = (t) => { const [i] = segAt(t), dx = P[i].x - P[i - 1].x, dy = P[i].y - P[i - 1].y, l = Math.hypot(dx, dy) || 1; return {x: -dy / l, y: dx / l}; };
  const pts = [];
  for (let i = 1; i < P.length; i++) { const k = Math.max(1, Math.ceil((cum[i] - cum[i - 1]) / 16)); for (let j = i === 1 ? 0 : 1; j <= k; j++) pts.push({x: P[i - 1].x + ((P[i].x - P[i - 1].x) * j) / k, y: P[i - 1].y + ((P[i].y - P[i - 1].y) * j) / k}); }

  if (n.shape !== "note" && n.shape !== "text") {

      h("button", {type: "button", title: name, "aria-pressed": String((n.color || "default") === name), style: `background:${f};box-shadow:inset 0 0 0 1.5px ${s}`, onclick: () => mutate(() => (name === "default" ? delete n.color : (n.color = name)))})))));
    out.push(field("Status", "dashed border = proposed", seg([["current", "Current"], ["proposed", "Proposed"]], n.status || "current", (v) => mutate(() => (v === "current" ? delete n.status : (n.status = v))))));
    out.push(field("Group", "related nodes are laid out together", editable(() => n.group || "", (v) => (v.trim() ? (n.group = v.trim()) : delete n.group), false)));
    const card = (n.card = n.card || {});

    if (isMN()) {

    }
    for (const [key, hint, list] of CARD_FIELDS[S.doc.kind] || []) {

      const set = (v) => { if (list) { const a = v.split("\n").map((s) => s.trim()).filter(Boolean); a.length ? (card[key] = a) : delete card[key]; } else v ? (card[key] = v) : delete card[key]; };
      out.push(field(key, list ? (hint ? hint + " (one per line)" : "one per line") : hint, editable(get, set, true)));
    }
  } else {
    if (n.shape === "note") out.push(h("p", {class: "muted"}, "Notes are comments for the agent. They appear under “Open notes” in the model view."));
  }
  out.push(h("div", {class: "row"}, h("button", {class: "btn", onclick: () => mutate(() => { const c = JSON.parse(JSON.stringify(n)); c.id = uid("n"); c.x += 24; c.y += 24; S.doc.nodes.push(c); S.sel = {type: "node", id: c.id}; })}, "Duplicate"),
    h("button", {class: "btn danger", onclick: deleteSel}, "Delete")));
  return out;
}
function edgePanel(e) {
  const out = [h("h3", {}, `edge · ${node(e.from)?.label || e.from} → ${node(e.to)?.label || e.to}`)];
  if (isMN()) {

}
function docPanel() {
  const d = S.doc, out = [h("h3", {}, `${d.kind} · .vizeng/${S.name}.json`)];
  out.push(field("Title", "", editable(() => d.title || "", (v) => (d.title = v), false)));
  out.push(field("Summary", "", editable(() => d.summary || "", (v) => (v ? (d.summary = v) : delete d.summary), true)));
  if (d.kind === "system") {

    out.push(field("Technique", "design method being followed", editable(() => t.name || "", (v) => (t.name = v), false)));

  }
  out.push(field("Card details on canvas", "", seg([["on", "Show"], ["off", "Hide"]], S.showDetails ? "on" : "off", (v) => { S.showDetails = v === "on"; render(); renderPanel(); })));
  if (S.problems && S.problems.length) out.push(h("h3", {class: "sub"}, "Problems"), h("ul", {class: "problems"}, S.problems.map((p) => h("li", {}, p))));
  out.push(h("h3", {class: "sub"}, "Controls"), h("div", {class: "help"}));
  out[out.length - 1].innerHTML = "<kbd>V</kbd> select · <kbd>B</kbd> box · <kbd>C</kbd> circle · <kbd>T</kbd> text · <kbd>N</kbd> note · <kbd>A</kbd> connect<br>Drag canvas to pan · wheel / pinch to zoom<br><kbd>F</kbd> fit · <kbd>0</kbd> 100% · <kbd>+</kbd>/<kbd>−</kbd> zoom · <kbd>L</kbd> layout<br>Double-click canvas: new box · shape: edit label<br><kbd>⌫</kbd> delete · <kbd>⌘Z</kbd> undo · <kbd>⌘S</kbd> save · arrows nudge<br>Edits autosave to the repo; agent edits on disk reload here.";
  out.push(h("h3", {class: "sub"}, "New diagram"), newDocForm());
  return out;
}
function newDocForm() {
  const name = h("input", {placeholder: "name, e.g. internals", pattern: "[a-z0-9-]+"});
  const kind = h("select", {}, h("option", {value: "model-native"}, "model-native"), h("option", {value: "system"}, "system"));
  const msg = h("div", {class: "muted"});
  const go = async () => {
    const n = name.value.trim();
    if (!/^[a-z0-9][a-z0-9-]{0,63}$/.test(n)) { msg.textContent = "Use lowercase letters, digits and dashes."; return; }
    if (S.list.some((d) => d.name === n)) { msg.textContent = "That diagram already exists."; return; }
    const r = await api("doc", {name: n}, {method: "PUT", headers: {"Content-Type": "application/json"}, body: JSON.stringify({doc: {vizeng: 1, kind: kind.value, title: n, nodes: [], edges: []}, baseRev: ""})});
    if (r.status !== 200) { msg.textContent = r.body.error || "Create failed"; return; }
    await refreshList(); openDoc(n);
  };
  return h("div", {}, h("div", {class: "f"}, name), h("div", {class: "row"}, kind, h("button", {class: "btn", onclick: go}, "Create")), msg);
}

/* ------------------------------------------------------------------ io */
function setStatus(text, cls) { const s = $("status"); s.textContent = text; s.className = cls || ""; }
function banner(msg, buttons, isErr) {
  const b = $("banner"); $("bannerMsg").textContent = msg; const bb = $("bannerBtns"); bb.innerHTML = "";
  for (const [label, fn] of buttons || []) bb.append(h("button", {onclick: fn}, label));
  b.classList.toggle("err", !!isErr); b.classList.toggle("show", !!msg);
}
async function refreshList() {
  const r = await api("list");
  if (r.status !== 200) { banner(r.status === 403 ? "Missing or wrong token. Open the exact URL printed by vizeng serve." : (r.body.error || "Server error"), [], true); return false; }
  S.list = r.body.diagrams;
  const sel = $("docSel"); sel.innerHTML = "";
  for (const d of S.list) sel.append(h("option", {value: d.name, selected: d.name === S.name}, `${d.name}  (${d.kind || "?"})`));
  if (!S.list.length) sel.append(h("option", {value: ""}, "no diagrams yet"));
  return true;
}
function normalize(doc) {
  doc.nodes = Array.isArray(doc.nodes) ? doc.nodes : [];
  doc.edges = Array.isArray(doc.edges) ? doc.edges : [];
  return doc;
}
async function openDoc(name, keepView) {
  const r = await api("doc", {name});
  if (r.status !== 200) { banner(r.body.error || `Could not load ${name}`, [["Retry", () => openDoc(name, keepView)]], true); return; }
  const first = !S.doc || S.name !== name;
  S.name = name; S.doc = normalize(r.body.doc); S.rev = r.body.rev; S.problems = r.body.problems; S.dirty = false; S.conflict = false;
  if (first) { S.undo = []; S.redo = []; S.sel = null; } else keepSel();
  history.replaceState(null, "", `?token=${encodeURIComponent(TOKEN)}&name=${encodeURIComponent(name)}`);
  $("docSel").value = name; document.title = `${S.doc.title || name} · vizeng`;
  const placed = autoLayout(true);
  banner("");
  if (first || !keepView) fit(); else render();
  renderPanel();
  setStatus(S.problems && S.problems.length ? `${S.problems.length} problem(s)` : "Saved", S.problems && S.problems.length ? "err" : "ok");
  if (placed) { S.dirty = true; scheduleSave(); } // persist computed positions so agent and human agree
}
let saveTimer = null;
function scheduleSave() { if (S.ended) return sessionEnded(); setStatus("Unsaved…"); clearTimeout(saveTimer); saveTimer = setTimeout(() => save(false), 700); }
async function save(force) {
  if (!S.doc || S.saving || (!S.dirty && !force) || S.conflict || S.ended) return;
  S.saving = true; clearTimeout(saveTimer);
  const body = JSON.stringify({doc: S.doc, baseRev: S.rev});
  const r = await api("doc", {name: S.name}, {method: "PUT", headers: {"Content-Type": "application/json"}, body}).catch(() => ({status: 0, body: {}}));
  S.saving = false;
  if (r.status === 200) {
    S.rev = r.body.rev; S.problems = r.body.problems; S.dirty = false;
    setStatus(S.problems.length ? `Saved · ${S.problems.length} warning(s)` : "Saved", S.problems.length ? "err" : "ok");
    if (!S.sel && !$("panel").contains(document.activeElement)) renderPanel();
  } else if (r.status === 409) {
    S.conflict = true; setStatus("Conflict", "err");
    banner("The file changed on disk (probably the agent) while you had unsaved edits.", [["Load disk version", () => openDoc(S.name, true)], ["Keep mine", overwrite]]);
  } else if (r.status === 422) {
    setStatus("Not saved", "err"); banner("Not saved: " + (r.body.problems || [r.body.error]).join("; "), [], true);
  } else { setStatus("Server unreachable", "err"); banner("Cannot reach the vizeng server. Edits are kept in this tab; export JSON to be safe.", [["Retry", () => save(true)]], true); }
}
async function overwrite() {
  const r = await api("rev", {name: S.name}); S.rev = r.body.rev; S.conflict = false; banner(""); await save(true);
}
/* Session lifetime. The server exits on its own after idle time or once every tab has closed
   (see vizeng.py Session). Polling is a heartbeat, not activity: we report how long ago the
   human actually touched the page, so an abandoned open tab does not keep the server alive. */
const CLIENT = Math.random().toString(36).slice(2, 12);
let lastInteraction = performance.now(), pollFailures = 0, idleBanner = false;
for (const t of ["pointerdown", "keydown", "wheel", "input"]) document.addEventListener(t, () => (lastInteraction = performance.now()), {capture: true, passive: true});
window.addEventListener("pagehide", () => navigator.sendBeacon(`/api/bye?${new URLSearchParams({token: TOKEN, client: CLIENT})}`));
function sessionEnded() {
  S.ended = true; clearTimeout(saveTimer); setStatus("Session ended", "err");
  const unsaved = S.dirty ? " You have unsaved edits: use JSON to download them." : ` Everything is saved in .vizeng/${S.name || ""}.json.`;
  banner("This vizeng session has closed (no activity, or its tab was closed)." + unsaved + " Ask your agent to reopen it.", S.dirty ? [["Download JSON", exportJson]] : [], true);
}
function idleCountdown(left, total) {
  if (left != null && left <= Math.min(60, (total || 600) / 3)) {
    idleBanner = true;
    banner(`Closing in ${Math.ceil(left)}s - no activity.`, [["Keep open", () => { lastInteraction = performance.now(); banner(""); idleBanner = false; }]]);
  } else if (idleBanner) { idleBanner = false; banner(""); }
}
async function poll() {
  if (S.ended) return;
  const ago = ((performance.now() - lastInteraction) / 1000).toFixed(1);
  const r = await api("rev", {name: S.name || "", client: CLIENT, ago}).catch(() => null);
  if (!r || r.status !== 200) {
    // two misses in a row: the server is gone (a 403 means a different server took the port)
    if (++pollFailures >= 2) return sessionEnded();
  } else {
    pollFailures = 0;
    if (!S.conflict) idleCountdown(r.body.idle_left, r.body.idle_total);
    if (S.doc && !S.saving && !S.conflict && r.body.rev && r.body.rev !== S.rev) {
      if (!S.dirty) { await openDoc(S.name, true); setStatus("Updated from disk", "ok"); }
      else { S.conflict = true; banner("The file changed on disk while you had unsaved edits.", [["Load disk version", () => openDoc(S.name, true)], ["Keep mine", overwrite]]); }
    }
  }
  setTimeout(poll, 1200);
}
function download(name, blob) { const a = h("a", {href: URL.createObjectURL(blob), download: name}); document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }
function exportJson() { download(`${S.name || "diagram"}.json`, new Blob([JSON.stringify(S.doc, null, 2) + "\n"], {type: "application/json"})); }
function exportPng() {
  const R = routes(), b = sceneBounds(R); if (!b) return;
  const pad = 40, scale = 2, W = Math.ceil(b.w + pad * 2), H = Math.ceil(b.h + pad * 2);
  const markup = `<svg xmlns="http://www.w3.org/2000/svg" width="${W * scale}" height="${H * scale}" viewBox="0 0 ${W} ${H}">${DEFS}<rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(${pad - b.x},${pad - b.y})">${sceneMarkup(true, R)}</g></svg>`;
  const img = new Image();
  img.onload = () => {
    const c = h("canvas", {width: W * scale, height: H * scale}); c.getContext("2d").drawImage(img, 0, 0);
    c.toBlob((blob) => download(`${S.name || "diagram"}.png`, blob), "image/png");
  };
  img.onerror = () => banner("PNG export failed to rasterize the diagram.", [], true);
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(markup);
}
$("fileIn").addEventListener("change", async (ev) => {
  const f = ev.target.files[0]; ev.target.value = ""; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (d.vizeng !== 1 || !Array.isArray(d.nodes)) throw new Error("not a vizeng v1 document");
    pushUndo(); S.doc = normalize(d); S.sel = null; autoLayout(true); changed(); renderPanel(); fit();
  } catch (e) { banner("Import failed: " + e.message, [], true); }
});

/* ------------------------------------------------------------------ boot */
document.querySelectorAll("[data-tool]").forEach((b) => b.addEventListener("click", () => setTool(b.dataset.tool)));
$("bUndo").onclick = undo; $("bRedo").onclick = redo; $("bLayout").onclick = () => S.doc && relayout();
$("zIn").onclick = () => zoomCenter(1.2); $("zOut").onclick = () => zoomCenter(1 / 1.2); $("zFit").onclick = fit;
$("zoomPct").onclick = () => { const r = stage.getBoundingClientRect(); zoomAt(1 / S.view.k, r.width / 2, r.height / 2); };
$("bJson").onclick = () => S.doc && exportJson(); $("bPng").onclick = () => S.doc && exportPng(); $("bImport").onclick = () => $("fileIn").click();
$("docSel").onchange = async (ev) => { if (!ev.target.value) return; if (S.dirty) await save(true); openDoc(ev.target.value); };
window.addEventListener("resize", render);
window.addEventListener("beforeunload", (ev) => { if (S.dirty) { save(true); ev.preventDefault(); } });
setTool("select");
(async () => {
  if (!(await refreshList())) return;
  if (!S.name && S.list.length) S.name = S.list[0].name;
  if (S.name) await openDoc(S.name); else renderPanel();
  poll();
})();
window.vizeng = S; window.vizengRoute = routeAll; window.vizengRender = render; // for automated verification
</script>
